name: Market Signals weekly update

on:
  schedule:
    - cron: "13 18 * * 1"       # Monday 18:13 UTC (1:13 PM CT during CDT) - regular weekly run
    - cron: "13 18 * * 0,2-6"   # other days - catch-up run, only if the published file is more than 7 days old
  pull_request:                 # dry run on PRs that touch the pipeline: 3 channels, no Apify spend, never publishes
    paths: ["pipeline/**", ".github/workflows/market-signals.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to main if every check passes (only honored on main)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-signals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide whether to run
        id: decide
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt, os
          g = json.load(open("signals.json"))["generated_at"]
          age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(g)).total_seconds() / 86400
          ev, cron = os.environ["EV"], os.environ.get("CRON", "")
          run = ev != "schedule" or cron == "13 18 * * 1" or age > 7
          print(f"run={'true' if run else 'false'}"); print(f"age_days={age:.1f}")
          PY
        env:
          EV: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}

      - name: Skip (published file is fresh)
        if: steps.decide.outputs.run != 'true'
        run: echo "signals.json is ${{ steps.decide.outputs.age_days }} days old; nothing to do."

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        if: steps.decide.outputs.run == 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Restore pipeline state (seen videos, judgments, cached transcripts)
        if: steps.decide.outputs.run == 'true'
        run: |
          if git ls-remote --exit-code origin pipeline-state >/dev/null; then
            git fetch --depth 1 origin pipeline-state
            git worktree add /tmp/state FETCH_HEAD
            mkdir -p pipeline/state pipeline/cache
            cp -r /tmp/state/state/. pipeline/state/
            cp -r /tmp/state/transcripts pipeline/cache/transcripts
          else
            echo "::warning::No pipeline-state branch; starting from empty state"
          fi

      - name: Restore Scryfall cache
        if: steps.decide.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: pipeline/cache/scry_cache.json
          key: scryfall-${{ github.run_id }}
          restore-keys: scryfall-

      - name: Run pipeline
        if: steps.decide.outputs.run == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TZ: America/Chicago
          ALLOW_NO_JUDGE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          DISCOVER_ARGS: ${{ github.event_name == 'pull_request' && '--channels @MTGGoldfish,@SBMTG,@JoelareMagic' || '' }}
          TRANSCRIPT_ARGS: ${{ github.event_name == 'pull_request' && '--skip apify' || '' }}
        run: pipeline/ci_run.sh

      - name: Upload run artifacts
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            pipeline/out/
            pipeline/runs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish signals.json and save state
        if: success() && steps.decide.outputs.run == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
        run: |
          git config user.name "market-signals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # state branch first (prune transcripts older than 45 days)
          rm -rf /tmp/state/state /tmp/state/transcripts 2>/dev/null || true
          if [ ! -d /tmp/state ]; then git worktree add --orphan -b pipeline-state /tmp/state; fi
          mkdir -p /tmp/state/state /tmp/state/transcripts
          cp pipeline/state/*.json /tmp/state/state/
          find pipeline/cache/transcripts -name '*.json' -mtime -45 -exec cp {} /tmp/state/transcripts/ \;
          (cd /tmp/state && git add -A && git commit -qm "state after run ${{ github.run_id }}" && git push origin HEAD:pipeline-state) || echo "state unchanged"
          cp pipeline/out/signals.json signals.json
          git add signals.json
          git commit -m "Weekly Market Signals update $(date +%F) (Actions run ${{ github.run_id }})"
          git push origin HEAD:main
